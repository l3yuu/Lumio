name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Start backend server
        run: |
          cd backend
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/lumio_test" \
          SECRET_KEY="ci-test-secret-key-change-in-production" \
          ALGORITHM="HS256" \
          USE_CONSOLE_EMAIL="True" \
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for server to be ready..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8000/api/health > /dev/null 2>&1; then
              echo "Server is ready!"
              break
            fi
            echo "Attempt $i/30..."
            sleep 2
          done

      - name: Run tests
        run: python backend/test_api.py

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run linter
        run: npm run lint
        working-directory: frontend

      - name: Type-check & build
        run: npm run build
        working-directory: frontend

  deploy:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Verify Secrets Lengths
        run: |
          echo "=== Secrets ==="
          echo "VITE_GOOGLE_CLIENT_ID secret length: ${#CLIENT_ID_SEC}"
          echo "VITE_API_BASE_URL secret length: ${#API_URL_SEC}"
          echo "=== Variables (vars) ==="
          echo "VITE_GOOGLE_CLIENT_ID var length: ${#CLIENT_ID_VAR}"
          echo "VITE_API_BASE_URL var length: ${#API_URL_VAR}"
        env:
          CLIENT_ID_SEC: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          API_URL_SEC: ${{ secrets.VITE_API_BASE_URL }}
          CLIENT_ID_VAR: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          API_URL_VAR: ${{ vars.VITE_API_BASE_URL }}

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Write frontend .env.production from GitHub
        run: |
          cat > frontend/.env.production << 'EOF'
          VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL }}
          VITE_WS_BASE_URL=${{ secrets.VITE_WS_BASE_URL || vars.VITE_WS_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID || vars.VITE_GOOGLE_CLIENT_ID }}
          EOF
          echo "Generated frontend/.env.production (keys only):"
          grep -o '^[^=]*' frontend/.env.production

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Project Info
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Inspect Vercel Env Variables
        run: |
          if [ -f .vercel/.env.production.local ]; then
            echo "Found .vercel/.env.production.local. Keys and lengths:"
            while IFS= read -r line || [ -n "$line" ]; do
              # Skip comments and empty lines
              if [[ "$line" =~ ^[[:space:]]*# ]] || [[ -z "$line" ]]; then
                continue
              fi
              # Print the key and the length of the value
              if [[ "$line" =~ ^([^=]+)=(.*)$ ]]; then
                key="${BASH_REMATCH[1]}"
                val="${BASH_REMATCH[2]}"
                echo "$key length: ${#val}"
              fi
            done < .vercel/.env.production.local
          else
            echo ".vercel/.env.production.local not found!"
          fi

      - name: Build with Vercel (uses our .env.production)
        run: vercel build --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt output to Vercel
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Trigger Render Deployment
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is missing! Please add it in your GitHub Repository Settings."
            exit 1
          fi
          curl -f -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}



